[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nicegui-tui"
version = "0.1.0"
description = "Bridge a NiceGUI app to a Textual TUI served over SSH."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "nicegui==3.10.0",
    "textual==8.2.3",
    "asyncssh==2.22.0",
]

[project.optional-dependencies]
test = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
]

[project.scripts]
nicegui-tui = "nicegui_tui.lint:main"

[tool.setuptools.packages.find]
include = ["nicegui_tui*"]
